name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy (staging or production)"
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: ${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Resolve environment
        id: env
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            echo "app_env=production" >> "$GITHUB_OUTPUT"
            echo "profile=production" >> "$GITHUB_OUTPUT"
            echo "tag=production" >> "$GITHUB_OUTPUT"
            echo "env_file=.env.production" >> "$GITHUB_OUTPUT"
          else
            echo "app_env=staging" >> "$GITHUB_OUTPUT"
            echo "profile=staging" >> "$GITHUB_OUTPUT"
            echo "tag=staging" >> "$GITHUB_OUTPUT"
            echo "env_file=.env.staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate environment file
        env:
          WORKTAG_ENV: ${{ secrets.WORKTAG_ENV }}
        run: |
          if [ -z "$WORKTAG_ENV" ]; then
            echo "::error::Missing 'WORKTAG_ENV' secret in the '${{ github.event.ref }}' environment. Store the full ${{ steps.env.outputs.env_file }} contents as a base64-encoded secret."
            exit 1
          fi
          echo "$WORKTAG_ENV" | base64 -d > "${{ steps.env.outputs.env_file }}"
          node scripts/check-env.mjs "${{ steps.env.outputs.env_file }}"

      - name: Build image
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_IMAGE_HOSTS: ${{ secrets.NEXT_PUBLIC_IMAGE_HOSTS }}
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_APP_URL="$NEXT_PUBLIC_APP_URL" \
            --build-arg NEXT_PUBLIC_IMAGE_HOSTS="$NEXT_PUBLIC_IMAGE_HOSTS" \
            -t "ghcr.io/${{ github.repository }}/worktag:${{ steps.env.outputs.tag }}" .

      - name: Push image to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "ghcr.io/${{ github.repository }}/worktag:${{ steps.env.outputs.tag }}"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_DIR }}"
            export IMAGE_REPO="${{ github.repository }}"
            export WORKTAG_IMAGE_TAG="${{ steps.env.outputs.tag }}"
            echo "${{ secrets.WORKTAG_ENV }}" | base64 -d > "${{ steps.env.outputs.env_file }}"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose --profile "${{ steps.env.outputs.profile }}" pull
            docker compose --profile "${{ steps.env.outputs.profile }}" up -d
            docker image prune -f
